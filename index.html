<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080711">
<meta name="description" content="ASYA HAZIR - GTA, gaming ve canlı yayın bağlantıları">
<title>ASYA HAZIR | Gaming</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Poppins:wght@400;500;600;700&display=swap');

*{box-sizing:border-box}
html{scroll-behavior:smooth}

body{
    margin:0;
    min-height:100vh;
    color:#fff;
    font-family:Poppins,Arial,sans-serif;
    background:#070711 url("neon-palmiye-arka-plan.svg") center top / cover fixed no-repeat;
    overflow-x:hidden;
}

body:before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:linear-gradient(180deg,rgba(3,3,12,.05),rgba(4,3,14,.42));
    z-index:0;
}

.container{
    width:min(100% - 32px,560px);
    margin:auto;
    padding:52px 0 34px;
    text-align:center;
    position:relative;
    z-index:1;
}


.cover-photo{
    width:148px;
    height:148px;
    margin:0 auto 20px;
    border-radius:50%;
    padding:4px;
    position:relative;
    background:linear-gradient(135deg,#ff3c9d,#7a4dff 55%,#00d9ff);
    box-shadow:0 0 28px rgba(255,37,151,.45),0 0 70px rgba(112,58,255,.25);
}
.cover-photo:before{
    content:"";
    position:absolute;
    inset:-5px;
    border-radius:50%;
    border:1px solid rgba(255,70,170,.35);
    box-shadow:0 0 24px rgba(255,40,150,.25);
}
.cover-photo img{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
    object-position:center;
    border-radius:50%;
    position:relative;
    z-index:1;
}

.logo{
    width:108px;
    height:108px;
    margin:0 auto 18px;
    border-radius:50%;
    display:grid;
    place-items:center;
    position:relative;
    background:linear-gradient(145deg,#ff3c9d,#7a4dff 55%,#00d9ff);
    box-shadow:0 0 25px rgba(255,37,151,.45),0 0 70px rgba(112,58,255,.22);
}

.logo:before{
    content:"";
    position:absolute;
    inset:5px;
    border-radius:50%;
    background:#0b0914;
}

.logo span{
    position:relative;
    z-index:2;
    font-family:Orbitron,sans-serif;
    font-size:30px;
    font-weight:800;
    letter-spacing:-3px;
    background:linear-gradient(135deg,#ff58ad,#b58aff,#48e9ff);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

h1{
    margin:0;
    font-family:Orbitron,sans-serif;
    font-size:clamp(30px,8vw,46px);
    line-height:1;
    letter-spacing:3px;
    text-shadow:0 0 8px rgba(255,52,158,.7),0 0 28px rgba(142,75,255,.45);
    background:linear-gradient(90deg,#ff4a9f 0%,#ff72bd 35%,#b26cff 65%,#4de5ff 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.tagline{
    margin:12px 0 20px;
    color:#e4dff0;
    font-size:12px;
    letter-spacing:4px;
    text-transform:uppercase;
    text-shadow:0 0 12px rgba(185,125,255,.7);
}

.live{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:8px 17px;
    border:1px solid rgba(255,47,133,.8);
    border-radius:999px;
    color:#ff5ba9;
    background:rgba(255,24,126,.06);
    box-shadow:0 0 22px rgba(255,24,126,.13);
    font-size:12px;
    font-weight:700;
    letter-spacing:1.4px;
    margin-bottom:28px;
}

.dot{
    width:7px;height:7px;border-radius:50%;
    background:#ff2f82;
    box-shadow:0 0 12px #ff2f82;
    animation:pulse 1.2s infinite;
}

@keyframes pulse{
    50%{opacity:.35;transform:scale(.75)}
}

.links{
    display:grid;
    gap:13px;
}

.link{
    position:relative;
    min-height:74px;
    padding:13px 52px 13px 18px;
    display:flex;
    align-items:center;
    gap:15px;
    text-decoration:none;
    text-align:left;
    color:#fff;
    border:1px solid rgba(208,145,255,.22);
    border-radius:9px;
    background:linear-gradient(110deg,rgba(10,8,24,.82),rgba(17,10,31,.70));
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    box-shadow:0 8px 25px rgba(0,0,0,.28),inset 0 0 24px rgba(153,79,255,.035);
    overflow:hidden;
    transition:.22s ease;
}

.link:before{
    content:"";
    width:3px;
    position:absolute;
    left:0;top:0;bottom:0;
    background:linear-gradient(#ff258e,#8c48ff);
    box-shadow:0 0 15px #ff258e;
}

.link:hover{
    transform:translateY(-3px) scale(1.01);
    border-color:rgba(255,55,157,.45);
    box-shadow:0 10px 32px rgba(255,30,146,.12);
}

.icon{
    width:42px;height:42px;
    flex:0 0 42px;
    display:grid;
    place-items:center;
    border-radius:9px;
    font-size:20px;
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.05);
}

.text strong{
    display:block;
    font-family:Orbitron,sans-serif;
    font-size:14px;
    letter-spacing:.6px;
}

.text small{
    display:block;
    color:#716d82;
    margin-top:4px;
    font-size:11px;
}

.arrow{
    position:absolute;
    right:18px;
    color:#8f7da9;
    font-size:21px;
    transition:.2s;
}

.link:hover .arrow{transform:translateX(4px);color:#ff56a8}

.youtube:before{background:linear-gradient(#ff277e,#ff277e);box-shadow:0 0 15px #ff277e}
.instagram:before{background:linear-gradient(#ff3b9b,#7d4cff)}
.discord:before{background:#5865f2;box-shadow:0 0 15px #5865f2}
.donate:before{background:#00d8ff;box-shadow:0 0 15px #00d8ff}
.games:before{background:#9b45ff;box-shadow:0 0 15px #9b45ff}

footer{
    margin-top:38px;
    color:#4f4b5c;
    font-size:11px;
    letter-spacing:1px;
}

@media(max-width:430px){
    .container{padding-top:34px}
    
.cover-photo{
    width:148px;
    height:148px;
    margin:0 auto 20px;
    border-radius:50%;
    padding:4px;
    position:relative;
    background:linear-gradient(135deg,#ff3c9d,#7a4dff 55%,#00d9ff);
    box-shadow:0 0 28px rgba(255,37,151,.45),0 0 70px rgba(112,58,255,.25);
}
.cover-photo:before{
    content:"";
    position:absolute;
    inset:-5px;
    border-radius:50%;
    border:1px solid rgba(255,70,170,.35);
    box-shadow:0 0 24px rgba(255,40,150,.25);
}
.cover-photo img{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
    object-position:center;
    border-radius:50%;
    position:relative;
    z-index:1;
}

.cover-photo{width:118px;height:118px}.logo{width:92px;height:92px}
    .logo span{font-size:25px}
    .tagline{letter-spacing:2px;font-size:11px}
    .link{min-height:70px}
}
</style>
</head>

<body>
<main class="container">

    <div class="cover-photo">
        <img src="asya-hazir-kapak.jpg" alt="ASYA HAZIR gaming kapak fotoğrafı">
    </div>

    <h1>ASYA HAZIR</h1>
    <div class="tagline">GTA • GAMING • CANLI YAYIN</div>

    <div class="live">
        <span class="dot"></span>
        CANLI YAYIN
    </div>

    <section class="links">

        <a class="link youtube" href="https://www.youtube.com/@ASYAHAZIR" target="_blank" rel="noopener">
            <div class="icon">▶</div>
            <div class="text">
                <strong>YOUTUBE</strong>
                <small>@ASYAHAZIR • Videolar & canlı yayınlar</small>
            </div>
            <span class="arrow">›</span>
        </a>

        <!-- BURAYA KENDİ INSTAGRAM ADRESİNİ YAZ -->
        <a class="link instagram" href="https://www.instagram.com/asyagamee/?hl=tr" target="_blank" rel="noopener">
            <div class="icon">◎</div>
            <div class="text">
                <strong>INSTAGRAM</strong>
                <small>Günlük içerikler & duyurular</small>
            </div>
            <span class="arrow">›</span>
        </a>

        <!-- BURAYA DISCORD DAVET LİNKİNİ YAZ -->
        <a class="link discord" href="https://discord.gg/hcrxGTuKzv" target="_blank" rel="noopener">
            <div class="icon">◉</div>
            <div class="text">
                <strong>DISCORD</strong>
                <small>Topluluğa katıl</small>
            </div>
            <span class="arrow">›</span>
        </a>

        <!-- BURAYA BAĞIŞ LİNKİNİ YAZ -->
        <a class="link donate" href="https://www.bynogame.com/tr/destekle/asyhzr" target="_blank" rel="noopener">
            <div class="icon">₺</div>
            <div class="text">
                <strong>BAĞIŞ & DESTEK</strong>
                <small>Yayına destek ol</small>
            </div>
            <span class="arrow">›</span>
        </a>

        <a class="link games" href="https://www.youtube.com/@ASYAHAZIR/videos" target="_blank" rel="noopener">
            <div class="icon">🎮</div>
            <div class="text">
                <strong>OYUN VİDEOLARI</strong>
                <small>GTA & diğer oyunlar</small>
            </div>
            <span class="arrow">›</span>
        </a>

    </section>

    <footer>© 2026 ASYA HAZIR • GAMING</footer>
</main>
</body>
</html>
