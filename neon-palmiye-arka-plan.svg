<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#06081a"/>
    <stop offset=".42" stop-color="#10113b"/>
    <stop offset=".72" stop-color="#442060"/>
    <stop offset="1" stop-color="#12091f"/>
  </linearGradient>
  <radialGradient id="sun" cx="50%" cy="68%" r="30%">
    <stop offset="0" stop-color="#ff79b8" stop-opacity=".8"/>
    <stop offset=".35" stop-color="#ff4f9f" stop-opacity=".35"/>
    <stop offset="1" stop-color="#ff4f9f" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="grid" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ff4aa9" stop-opacity=".15"/>
    <stop offset="1" stop-color="#8b4dff" stop-opacity=".03"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="7" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect width="1600" height="1000" fill="url(#sky)"/>
<rect width="1600" height="1000" fill="url(#sun)"/>

<!-- subtle stars -->
<g fill="#b7b5ff" opacity=".55">
  <circle cx="160" cy="145" r="2"/><circle cx="330" cy="220" r="1.5"/>
  <circle cx="1210" cy="150" r="2"/><circle cx="1410" cy="260" r="1.5"/>
  <circle cx="980" cy="105" r="1.5"/><circle cx="720" cy="185" r="1.2"/>
</g>

<!-- distant neon horizon -->
<path d="M0 720 Q400 660 800 720 T1600 700 L1600 1000 L0 1000Z" fill="#090716"/>
<path d="M0 735 Q400 675 800 735 T1600 715" fill="none" stroke="#ff3fa2" stroke-width="3" opacity=".5" filter="url(#glow)"/>

<!-- perspective road grid -->
<g stroke="url(#grid)" fill="none" opacity=".8">
  <path d="M800 710 L100 1000"/><path d="M800 710 L300 1000"/>
  <path d="M800 710 L500 1000"/><path d="M800 710 L650 1000"/>
  <path d="M800 710 L950 1000"/><path d="M800 710 L1100 1000"/>
  <path d="M800 710 L1300 1000"/><path d="M800 710 L1500 1000"/>
  <path d="M500 780 H1100"/><path d="M350 840 H1250"/>
  <path d="M180 920 H1420"/>
</g>

